services:
  prescript_frontend:
    container_name: prescript_frontend
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL}
    env_file:
      - .env
    ports:
      - "5175:80"
    restart: unless-stopped
    networks:
      - prescript-network

networks:
  prescript-network:
    driver: bridge
